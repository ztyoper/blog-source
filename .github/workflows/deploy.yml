name: Publish Firefly to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Re-render every page and replace the build cache
        type: boolean
        default: false

permissions:
  contents: read

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'ztyoper/blog-source' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      FIREFLY_INCREMENTAL_BUILD: "1"
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Astro build cache
        if: inputs.full_rebuild != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &astro-cache-restore
          path: &astro-cache-paths |
            node_modules/.astro/data-store.json
            node_modules/.astro/firefly-content-key
            node_modules/.astro/incremental-build.json
            node_modules/.astro/dist
            node_modules/.astro/firefly-pagefind
          key: &astro-cache-key firefly-astro-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            firefly-astro-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check Astro and TypeScript
        run: |
          node --input-type=module -e "import { prepareMarkdownCache } from './scripts/prepare-markdown-cache.mjs'; await prepareMarkdownCache()"
          pnpm check
          pnpm type-check

  build:
    if: github.repository == 'ztyoper/blog-source' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Astro build cache
        if: inputs.full_rebuild != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *astro-cache-restore

      - name: Build site
        env:
          FIREFLY_INCREMENTAL_BUILD: '1'
          FIREFLY_FULL_REBUILD: ${{ inputs.full_rebuild && '1' || '0' }}
        run: pnpm run build

      - name: Save Astro build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: *astro-cache-paths
          key: *astro-cache-key

      - name: Upload generated site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefly-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - name: Download generated site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firefly-site
          path: dist

      - name: Check site entry point
        run: test -s dist/index.html

      - name: Publish to public gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_PUBLISH_TOKEN }}
          external_repository: ztyoper/ztyoper.github.io
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          user_name: ${{ github.repository_owner }}
          user_email: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
          full_commit_message: Publish Firefly site
