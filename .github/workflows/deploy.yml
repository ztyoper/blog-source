name: Publish Firefly to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ztyoper/blog-source' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro and TypeScript
        run: |
          pnpm check
          pnpm type-check
      
      - name: Build site
        run: pnpm run build

      - name: Upload generated site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefly-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    permissions: {}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download generated site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firefly-site
          path: dist

      - name: Check site entry point
        run: test -s dist/index.html

      - name: Publish to public gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_PUBLISH_TOKEN }}
          external_repository: ztyoper/ztyoper.github.io
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          user_name: ${{ github.repository_owner }}
          user_email: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
          full_commit_message: Publish Firefly site
